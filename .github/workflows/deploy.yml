name: Build and Deploy
# para probar en desarrollo
# .github/workflows/run-action.bash
on:
  push:
    branches:
      - master
env:
  APP_DOMAIN: 'homeevolutioncontractor.ideasoft.site'
  SERVER_DIR: '/public_html/homeevolutioncontractor.ideasoft.site'

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configurar variables de entorno
        run: |
          cp .env.example .env
          echo -e "\n" >> .env
          echo "APP_URL=${{env.APP_DOMAIN}}" >> .env
          echo "DB_DATABASE=${{secrets.DB_DATABASE}}" >> .env
          echo "DB_USERNAME=${{secrets.DB_USERNAME}}" >> .env
          echo "DB_PASSWORD=${{secrets.DB_PASSWORD}}" >> .env

      - name: Setup Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3.x'
          tools: composer:v2
          coverage: xdebug

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install Composer Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Assets
        run: npm run build

      - name: 📂 Sync files
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{secrets.FTP_DOMAIN}}
          username: ${{secrets.DB_USERNAME}}
          password: ${{secrets.DB_PASSWORD}}
          local-dir: ./
          server-dir: ${{env.SERVER_DIR}}/
